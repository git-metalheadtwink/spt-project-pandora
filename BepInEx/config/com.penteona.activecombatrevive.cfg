## Settings file was created by plugin Active Combat Revive v1.0.0
## Plugin GUID: com.penteona.activecombatrevive

[1. General]

## Allow a haemostatic or tourniquet to be applied to a downed teammate, freezing their bleedout timer until surgery is performed.
# Setting type: Boolean
# Default value: true
Allow Stabilizing = true

## Scale the operation time with the surgeon's Surgery skill, exactly as vanilla field surgery does.
# Setting type: Boolean
# Default value: true
Surgery Skill Affects Speed = true

## Fixed operation time in seconds. Leave at 0 to use each kit's own vanilla use time (CMS 16s, Surv12 20s).
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 120
Surgery Time Override = 0

[2. Items]

## Comma separated template ids of items usable to revive a downed teammate. Defaults to CMS and Surv12.
# Setting type: String
# Default value: 5d02778e86f774203e7dedbe,5d02797c86f774203f38e30a
Surgery Kit Template Ids = 5d02778e86f774203e7dedbe,5d02797c86f774203f38e30a

## Comma separated template ids of items usable to stop a downed teammate's bleedout timer. Defaults to CAT, Esmarch and CALOK-B.
# Setting type: String
# Default value: 60098af40accd37ef2175f27,5e831507ea0a7c419c2f9bd9,5e8488fa988a8701445df1e4
Stabilize Template Ids = 60098af40accd37ef2175f27,5e831507ea0a7c419c2f9bd9,5e8488fa988a8701445df1e4

[3. Interruption]

## Cancel the operation if the surgeon takes combat damage. Bleeding and metabolism ticks are ignored.
# Setting type: Boolean
# Default value: true
Cancel On Damage = true

## How far the surgeon may drift from where they started before the operation is cancelled. Set to 0 to disable the movement check.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0 to 10
Max Move Distance = 0.75

## Match vanilla behaviour: a kit still loses a charge when an operation is interrupted after the game's interruption grace period.
# Setting type: Boolean
# Default value: true
Consume Kit On Late Interrupt = true

