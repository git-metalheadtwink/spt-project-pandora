[Slot Access Delays]

## Configures whether or not to use the configurable delays below when using items from those slots.
# Setting type: Boolean
# Default value: false
Enable Slot Delays = false

## Configures whether or not to show the themed item-use delay timer.
# Setting type: Boolean
# Default value: true
Show Timer Panel = true

## Makes the player crouch, bring the equipped backpack into view, and rummage through it while waiting to use an item from the backpack.
# Setting type: Boolean
# Default value: true
Animate Backpack Access = true

## Positions the animated backpack across the screen: 0 is the left edge and 1 is the right edge.
# Setting type: Single
# Default value: 0.46
# Acceptable value range: From 0.2 to 0.8
Backpack Horizontal Position = 0.46

## Positions the animated backpack vertically: 0 is the bottom edge and 1 is the top edge.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0.05 to 0.65
Backpack Vertical Position = 0.15

## Controls how large the animated backpack appears on screen.
# Setting type: Single
# Default value: 0.64
# Acceptable value range: From 0.45 to 0.95
Backpack View Size = 0.64

## Cancels the current delayed item-access attempt, including its queued follow-up, when the player starts moving.
# Setting type: Boolean
# Default value: true
Moving Cancels Access = true

## Cancels the current delayed item-access attempt, including its queued follow-up, when the player takes damage.
# Setting type: Boolean
# Default value: true
Damage Cancels Access = true

## Plays subtle interface sounds when an item-access delay completes or is cancelled.
# Setting type: Boolean
# Default value: true
Timer Sounds = true

## Controls item-use attempts made while an access delay is active: ignore them, cancel and use the latest item, queue the first extra item, or open the wheel to choose a replacement.
# Setting type: PendingUseMode
# Default value: CancelAndReplace
# Acceptable values: Ignore, CancelAndReplace, QueueOne, OpenWheel
Pending Item Use Behavior = CancelAndReplace

## Key used to cancel the current pending access and clear the next queued item.
# Setting type: KeyboardShortcut
# Default value: 
Clear Item Access Delay = 

## Additional delay, in seconds, for each container layer between the item and the equipped backpack, regardless of container type.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 5
Additional Backpack Nesting Delay = 0.5

## Additional delay, in seconds, before using a consumable stored in pockets.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 5
Pockets Delay = 0

## Additional delay, in seconds, before using a consumable stored in tactical vest.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 5
Tactical Vest Delay = 0.25

## Additional delay, in seconds, before using a consumable stored in arm band.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 5
Arm Band Delay = 0.5

## Additional delay, in seconds, before using a consumable stored in backpack.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 5
Backpack Delay = 1.5

## Additional delay, in seconds, before using a consumable stored in secured container.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 5
Secured Container Delay = 2

