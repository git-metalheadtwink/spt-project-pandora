## Settings file was created by plugin BlackHawk-QuickMeds v1.0.0
## Plugin GUID: com.blackhawk.quickmeds

[1. Movement]

## Run while using bandages, medkits and pills.
## 
## Splints and surgery kits have their own settings below.
# Setting type: Boolean
# Default value: true
Sprint while using meds = true

## Move while splinting or doing surgery, instead of standing still the whole time.
# Setting type: Boolean
# Default value: true
Walk while using splints or surgery kits = true

## Run while splinting or doing surgery.
## 
## Turn this off and leave walking on if you want to walk but not run.
## 
## Does nothing unless the walk setting above is on.
# Setting type: Boolean
# Default value: true
Sprint while using splints or surgery kits (needs walk on) = false

[2. Healing]

## Stop healing the moment the body part is full, instead of finishing the animation for nothing. Also stops when the item runs out.
## 
## Keeps going if the part is still bleeding. Broken bones always take the full time.
# Setting type: Boolean
# Default value: true
Heal auto cancel = true

[3. Healing speed]

## Heal faster when standing still, slower when running.
## 
## Turn off for normal healing times. Use the sliders below to set the speeds.
## 
## Does not affect pills, injectors, food or drink.
# Setting type: Boolean
# Default value: true
Adaptive healing speed = true

## Healing speed while not moving. 1.00 is normal, 2.00 is twice as fast.
# Setting type: Single
# Default value: 1.3
# Acceptable value range: From 0.7 to 2.5
Speed - standing still = 1

## Healing speed while walking. 1.00 means walking costs you nothing.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.7 to 2.5
Speed - walking = 0.75

## Healing speed while running. Below 1.00 means running makes it take longer.
## 
## Only matters if you can sprint while healing.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0.7 to 2.5
Speed - sprinting = 0.7

## Write what the mod is doing to the BepInEx log. Only needed for reporting a bug.
# Setting type: Boolean
# Default value: false
Log details to console = false

