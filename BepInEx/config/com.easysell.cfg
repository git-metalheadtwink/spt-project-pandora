## Settings file was created by plugin EasySell v1.1.0
## Plugin GUID: com.easysell

[1. General]

## Turns EasySell off entirely - no tooltips, no selling.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Enable plug-in = true

## Traders that are never considered, for either prices or selling. Separate with commas.
## 
## Example: Fence, Ragman
## 
## Names match case-insensitively, and a trader ID works too - which is the reliable option on a non-English client, where trader names are translated. Modded traders need no special handling, just type the name.
## 
## The list below shows every trader on this profile, so you can copy from it.
# Setting type: String
# Default value: 
Trader(s) to ignore = 

## A reference list for the box above. It fills in once your profile has loaded and the traders are known, and includes any added by mods.
# Setting type: String
# Default value: 
Traders on this profile = 

## Ignore traders that pay in anything other than roubles.
## 
## (Default: Disabled)
# Setting type: Boolean
# Default value: false
Roubles only = false

[2. Tooltip]

## Add price lines to the tooltip when you hover an item.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Show prices on tooltips = true

## Show which trader pays the most for the item, and how much.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Show trader price = true

## Show what the item would fetch on the flea market.
## 
## This is the price for a 100% chance of sale, not the raw market average - which is why it will not match the number on the add-offer screen.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Show flea price = true

## Which figures each price line shows.
## 
## Total - one number: what the whole thing is worth.
## PerSlot - one number: what it is worth per inventory slot.
## Both - "per-slot Total: total", which is busier but lets you compare a big item against a small one at a glance.
## 
## Price-per-slot decides the rarity colour whatever this is set to, since that is the figure that answers whether an item earns its space.
## 
## (Default: Total)
# Setting type: PriceDisplay
# Default value: Total
# Acceptable values: Total, PerSlot, Both
Price display = Total

## Show the combined value of every attachment fitted to a weapon.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Show weapon-mods price = true

## Show the combined value of the removable plates in a piece of armor.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Show armor-plates price = true

## Keep tooltips plain until you hold the key below, then extend them with the prices.
## 
## The tooltip updates while it is open, so you can hover something, press the key, and watch the prices appear without having to move the cursor away and back.
## 
## (Default: Disabled)
# Setting type: Boolean
# Default value: false
Only show prices while a key is held = true

## Held to reveal prices while the setting above is on.
## 
## (Default: Left Shift)
# Setting type: KeyboardShortcut
# Default value: LeftShift
Price reveal key = LeftShift

## How long the cursor must rest on an item before its tooltip appears.
## 
## (Plug-in default: 0, EFT default: 0.6)
# Setting type: Decimal
# Default value: 0.0
Tool-tip delay (seconds) = 0

## Show prices on items while you are in a raid, so you can judge what is worth the space.
## 
## Prices come from a table loaded before the raid started, so nothing is fetched from the server mid-raid and this costs no performance.
## 
## Turn it off if you would rather not know item values while looting.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Show prices in raid = true

[3. Selling]

## Add "EasySell (Trader)" when you right-click an item in your stash.
## 
## Sells to whichever trader pays the most.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Context menu: sell to trader = true

## Add "EasySell (Flea)" when you right-click an item in your stash.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Context menu: sell on flea = true

## Add "EasySell (Best)" when you right-click an item in your stash.
## 
## Decides per item whether the trader or the flea pays more, comparing price-per-slot in roubles, and sells each one wherever it is worth most.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Context menu: sell at best price = true

## Sell by holding a key and clicking an item, without opening the context menu.
## 
## Only works on the inventory screen, and never in raid.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Enable click-to-sell = true

## The key held while clicking to sell.
## 
## (Default: Q)
# Setting type: KeyboardShortcut
# Default value: Q
Click-to-sell key = Q

## Key + left mouse button sells to the best-paying trader.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Click-to-sell: left button sells to trader = true

## Key + right mouse button lists on the flea market.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Click-to-sell: right button lists on flea = true

## Key + middle mouse button sells each item wherever it is worth most.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Click-to-sell: middle button sells at best price = true

## Show a confirmation window with the total, and the listing fee where one applies, before anything is sold.
## 
## Turning this off sells immediately with no undo. Selling cannot be reversed, so leaving it on is strongly recommended if you use click-to-sell.
## 
## (Default: Enabled)
# Setting type: Boolean
# Default value: true
Ask before selling = true

## Skip anything still marked found-in-raid, so quest and hideout material is not sold by accident.
## 
## Can be overridden per sale with the key below.
## 
## (Default: Disabled)
# Setting type: Boolean
# Default value: false
Never sell found-in-raid items = false

## Held instead of the click-to-sell key, this sells even found-in-raid items.
## 
## Only does anything while "Never sell found-in-raid items" is on.
## 
## (Default: Q + Left Alt)
# Setting type: KeyboardShortcut
# Default value: Q + LeftAlt
Force-sell found-in-raid key = Q + LeftAlt

## During a flea sale, anything that cannot be listed goes to a trader instead of being skipped.
## 
## That covers running out of offer slots, and also items the flea will not accept at all - not found-in-raid on a found-in-raid-only server, or barred from the market entirely.
## 
## (Default: Disabled)
# Setting type: Boolean
# Default value: false
Sell to traders whatever the flea will not take = false

## Try to list more offers than you have slots for.
## 
## The server rejects whatever does not fit, so this is a way to find the limit rather than a way past it.
## 
## (Default: Disabled)
# Setting type: Boolean
# Default value: false
Ignore the flea offer slot limit = false

