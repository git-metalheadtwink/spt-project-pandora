[6. Flea market]

## Show flea prices even when the flea market is locked, or when the item is not found-in-raid and SPT is set to allow only found-in-raid sales.
## 
## (Default: Disabled)
# Setting type: Boolean
# Default value: false
Always show flea price = false

## Multiplier applied to the calculated flea price before it is shown.
## 
## (Default: 1.0)
# Setting type: Decimal
# Default value: 1.0
Flea price multiplicand = 1.0

## What percentage of the calculated flea price EasySell actually lists items at.
## 
## 100 = the price shown in the tooltip, which is the 100%-sell-chance price.
## Below 100 undercuts the market so listings move faster.
## Above 100 asks more and sells slower.
## 
## (Default: 100)
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 25 to 200
Listing price (%) = 100

## Subtract the listing fee from the flea price, so what you see is what you keep.
## 
## (Default: Disabled)
# Setting type: Boolean
# Default value: false
Include flea tax = false

## Show the listing fee as a separate figure in the tooltip.
## 
## (Default: Disabled)
# Setting type: Boolean
# Default value: false
Show flea tax = false

## With toggle mode on, the two settings above only apply while the key below is held.
## 
## (Default: Disabled)
# Setting type: Boolean
# Default value: false
Toggle-mode for flea tax = false

## Held to reveal the flea tax while toggle mode is on.
## 
## (Default: Left Alt)
# Setting type: KeyboardShortcut
# Default value: LeftAlt
Toggle-mode key = LeftAlt

## How often to pull fresh flea prices from your SPT server.
## 
## More frequent updates track a changing market more closely and cost the server more. On a shared Fika server that cost is multiplied by the number of players.
## 
## (Default: 5)
# Setting type: Int32
# Default value: 5
Update flea price interval (minutes) = 5

## Keep pulling prices while you are in a raid.
## 
## Off by default: the table loaded before the raid is already enough for in-raid tooltips, and not touching the network mid-raid is what keeps them free.
## 
## (Default: Disabled)
# Setting type: Boolean
# Default value: false
Update flea price during raids = false

