## Settings file was created by plugin maschine-AutoCorpseSearch v2.1.0
## Plugin GUID: com.maschine.AutoCorpseSearch

[General]

## Automatically resume searching slots that were interrupted (items still hidden).
# Setting type: Boolean
# Default value: true
Resume Partial Search = true

## Automatically resume interrupted searches on regular loot containers when re-opening them.
# Setting type: Boolean
# Default value: true
Resume Container Searches = true

[Picked-up Containers]

## Automatically search a rig or backpack the moment you equip it.
# Setting type: Boolean
# Default value: true
Search On Equip = true

## Automatically search a rig or backpack when you open it in its own window.
# Setting type: Boolean
# Default value: true
Search On Open = true

## Catch-up: search an already equipped rig or backpack that is still unsearched whenever the inventory screen opens.
# Setting type: Boolean
# Default value: true
Search Equipped On Inventory Open = true

## Restrict 'Search On Open' to containers you carry yourself. Turn off to also auto-search rigs and backpacks you open on a corpse or on the ground.
# Setting type: Boolean
# Default value: true
Only Own Containers = true

[Search Order]

## Priority order (lower number = searched first)
# Setting type: Int32
# Default value: 1
Chest Rig = 1

## Priority order (lower number = searched first)
# Setting type: Int32
# Default value: 2
Pockets = 2

## Priority order (lower number = searched first)
# Setting type: Int32
# Default value: 3
Backpack = 3

