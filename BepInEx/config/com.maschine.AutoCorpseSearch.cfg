## Settings file was created by plugin maschine-AutoCorpseSearch v2.2.0
## Plugin GUID: com.maschine.AutoCorpseSearch

[General]

## Automatically resume searching slots that were interrupted (items still hidden).
# Setting type: Boolean
# Default value: true
Resume Partial Search = true

## Automatically resume interrupted searches on regular loot containers when re-opening them.
# Setting type: Boolean
# Default value: true
Resume Container Searches = true

## With the Attention elite skill the game allows two searches at once. On: the mod fills both slots, so looting goes faster, but while it does the search button on other containers stays greyed out. Off: the mod keeps to one search and leaves the second slot free for you. Without the elite skill this changes nothing.
# Setting type: Boolean
# Default value: true
Use Double Search = true

[Picked-up Containers]

## Automatically search a rig, backpack or belt the moment you equip it.
# Setting type: Boolean
# Default value: true
Search On Equip = true

## Automatically search a container when you open it in its own window.
# Setting type: Boolean
# Default value: true
Search On Open = true

## Catch-up: search an already equipped rig, backpack or belt that is still unsearched whenever the inventory screen opens.
# Setting type: Boolean
# Default value: true
Search Equipped On Inventory Open = true

## Restrict 'Search On Open' to containers you carry yourself. Turn off to also auto-search containers you open on a corpse or on the ground.
# Setting type: Boolean
# Default value: true
Only Own Containers = true

[Search Order]

## Priority order (lower number = searched first)
# Setting type: Int32
# Default value: 1
Chest Rig = 1

## Priority order (lower number = searched first)
# Setting type: Int32
# Default value: 2
Pockets = 2

## Priority order (lower number = searched first)
# Setting type: Int32
# Default value: 3
Backpack = 3

## Priority order (lower number = searched first). Only does anything with a belt mod such as PackNStrap installed, which carries its belts in the armband slot. A plain armband is not searchable and is skipped.
# Setting type: Int32
# Default value: 4
Belt (Armband Slot) = 4

