[2. Volume]

## Volume of the other person's voice as heard over the radio. Above 1 boosts quiet voices but may introduce distortion.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.05 to 5
Receive Volume = 1

## Radio static/noise volume (minimum 5%, default 1)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.05 to 1
Noise Volume = 1

## Volume of radio sound effects (on/off clicks, start/end of transmission)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.05 to 1
Sound Volume = 1

[3. Radio]

## Language used for on-screen notifications and the Raid Recordings browser. 'Auto' follows the game's current language.
# Setting type: UiLanguage
# Default value: Auto
# Acceptable values: Auto, Russian, English, German, Spanish, French, Polish, Italian, Czech
UI Language = Auto

## On the Labyrinth map radio traffic is drowned in heavy interference and nothing can be made out, no matter which radio is used. Turn off to allow normal radio there.
# Setting type: Boolean
# Default value: true
Jam Radio in Labyrinth = true

## Simulated background combat sound in the radio channel: if there was recent gunfire near the speaker, a procedural crackle is mixed into their transmission. This is a SIMULATION (proximity gunfire detection), not real ambient audio capture.
# Setting type: Boolean
# Default value: true
Ambient Combat Sound (Experimental) = true

[4. Notifications]

## Show on-screen notifications about radio state (on/off, selection, mode). Custom overlay, no vanilla notification sound.
# Setting type: Boolean
# Default value: true
Show Notifications = true

## Look of the on-screen notifications. 'Themed' is the full military panel with a type tag and a remaining-time bar; 'Minimal' is just an accent stripe and the message. The 'Compact' variants of each are narrower with a smaller font, for less screen clutter. Colours always follow the BEAR/USEC theme.
# Setting type: NotificationStyle
# Default value: Themed
# Acceptable values: Themed, ThemedCompact, Minimal, MinimalCompact
Notification Style = Themed

## Colour scheme of the notifications. 'FollowWindow' uses the same faction theme as the Raid Recordings window; BEAR/USEC pins them independently, so you can pair a USEC window with BEAR notifications.
# Setting type: NotificationTheme
# Default value: FollowWindow
# Acceptable values: FollowWindow, BEAR, USEC
Notification Theme = FollowWindow

## Overall opacity of the notification panels. Lower values make them less obtrusive during a raid.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.2 to 1
Notification Opacity = 1

## Size of the on-screen notification popups.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 3
Notification Scale = 1

[5. Indicators]

## Dots = classic round lamps only. Blocks = angular military segments only. Badges = only the labelled ON AIR / RECEIVING meters driven by live audio levels. FullDots = round lamps plus those meters. FullBadges = angular segments plus those meters.
# Setting type: IndicatorStyle
# Default value: FullBadges
# Acceptable values: Dots, Blocks, Badges, FullDots, FullBadges
Indicator Style = FullBadges

## Size of the on-screen status indicators (dots/badges/battery/signal). Does not affect the Raid Recordings window, which already resizes by dragging its corner.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 3
Indicator Scale = 1

## Opacity of the status dots (minimum 5%)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.05 to 1
Indicator Opacity = 1

## Dim the indicators down while nothing is happening on the channel, and bring them back to full brightness on activity. Reduces visual clutter during quiet stretches.
# Setting type: Boolean
# Default value: true
Fade Indicators When Idle = true

## Small dot showing whether the radio is on (green) or off (gray)
# Setting type: Boolean
# Default value: true
Power Indicator = true

## Dot that appears only while YOU are transmitting on the radio.
# Setting type: Boolean
# Default value: true
Talking Indicator = true

## Red dot that appears only while someone is transmitting on your frequency.
# Setting type: Boolean
# Default value: true
Channel Busy Indicator = true

## Small dot showing the current Half-duplex/Duplex mode. Only visible while the radio is on.
# Setting type: Boolean
# Default value: true
Half-duplex/Duplex Indicator = true

## Shows signal quality of the current incoming transmission (see style below). Only appears while you can actually hear someone. Independent toggle from the other indicators.
# Setting type: Boolean
# Default value: true
Signal Strength Indicator = true

## Bar = a single fillable strip. AntennaBars = classic phone-style signal bars.
# Setting type: SignalIndicatorStyle
# Default value: Bar
# Acceptable values: Bar, AntennaBars
Signal Indicator Style = Bar

## Show the active radio's battery charge on screen. Only appears when a battery mod (e.g. Batteries Not Included) actually gives the radio battery slots — without one there is nothing to display.
# Setting type: Boolean
# Default value: true
Show Battery Charge = true

## Cell = a battery pictogram with charge segments. Bar = a thin segmented strip. Percent = numeric readout only. CellAndPercent / BarAndPercent add the number next to the pictogram or strip. Shown only while the radio is on.
# Setting type: BatteryIndicatorStyle
# Default value: Cell
# Acceptable values: Cell, Bar, Percent, CellAndPercent, BarAndPercent
Battery Indicator Style = Cell

## Show a brief frequency-dial sweep on screen when switching between radios. Purely cosmetic — it changes nothing about how the radio works.
# Setting type: Boolean
# Default value: true
Radio Tuning Sweep = true

[6. Colors]

## Color used for the Power indicator (radio on) and the matching notification text
# Setting type: Color
# Default value: 00FF00FF
Radio-On Color = 00FF00FF

## Color used for the Talking indicator (you are transmitting)
# Setting type: Color
# Default value: FF8C00FF
Talking Indicator Color = FF8C00FF

## Color used for the Channel Busy indicator
# Setting type: Color
# Default value: FF0000FF
Channel Busy Color = FF0000FF

## Color used for the Half-duplex/Duplex indicator (Duplex) and the matching notification text
# Setting type: Color
# Default value: FFEB04FF
Duplex Mode Color = FFEB04FF

## Fill color of the signal strength indicator (bar or antenna style)
# Setting type: Color
# Default value: FFFFFFFF
Signal Bar Fill Color = FFFFFFFF

## Color used for radio-selection notification text
# Setting type: Color
# Default value: 00FFFFFF
Radio Selection Color = 00FFFFFF

[7. Raid Recordings]

## Key (or key combination) to open/close the Raid Recordings browser, where you can play back recorded radio comms from past raids.
# Setting type: KeyboardShortcut
# Default value: F9
Open Raid Recordings = F9

## Record everything you hear over the radio during a raid to a WAV file, so you can listen back to it afterwards. Off by default — opt in if you want it. Recordings are saved under the plugin folder in a 'PRT-Records' subfolder.
# Setting type: Boolean
# Default value: false
Record Radio Comms = false

## Visual theme of the Raid Recordings window. 'Auto' follows your character's faction: BEAR shows a Russian Armed Forces field terminal, USEC shows a UNTAR peacekeeping console.
# Setting type: UiTheme
# Default value: Auto
# Acceptable values: Auto, BEAR, USEC
Window Theme = Auto

## Draw the recording as a spectrogram (frequency content over time) instead of a peak waveform. Speech and static look clearly different, making it easier to spot where someone is actually talking.
# Setting type: Boolean
# Default value: false
Spectrogram View = false

## Automatically delete all saved raid recordings after this many completed raids. 'Never' keeps everything until you clear manually.
# Setting type: CleanupFrequency
# Default value: Never
# Acceptable values: Never, EveryRaid, Every3Raids, Every5Raids, Every10Raids
Auto-Cleanup Frequency = Never

## Deletes every saved raid recording immediately.
# Setting type: Boolean
# Default value: false
Clear All Recordings Now = false

# Setting type: Int32
# Default value: 0
RaidsSinceCleanupInternal = 0

# Setting type: Single
# Default value: 1
RaidReviewPlaybackVolumeInternal = 1

# Setting type: Boolean
# Default value: true
RaidReviewAutoAdvanceInternal = true

# Setting type: Boolean
# Default value: true
RaidReviewNewestFirstInternal = true

# Setting type: Boolean
# Default value: false
RaidReviewSortByLocationInternal = false

# Setting type: String
# Default value: 
LastKnownNicknameInternal = Гит Дирол

# Setting type: String
# Default value: 
LastKnownSideInternal = Savage

[8. Developer]

## Log detailed per-frame/per-event debug info to the BepInEx console and prt-fika.log. Only enable when troubleshooting an issue — leave off for normal play to keep the log file small.
# Setting type: Boolean
# Default value: false
Verbose Logging = false

## Speeds up or slows down how fast the radio battery drains, for testing. 1 = normal. Changes are only picked up outside a raid, so the rate cannot be altered mid-raid.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 20
Battery Drain Multiplier = 1

