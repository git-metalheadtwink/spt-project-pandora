Ping Key = Q

## Maximum seconds between the two taps. Raise it if pings are not registering, lower it if you ping by accident while leaning.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0.1 to 0.6
Double Tap Window = 0.3

## Minimum seconds between your own pings.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 10
Ping Cooldown = 2

## PNG file inside the plugin's 'icons' folder, tinted by 'Ping Color'.
# Setting type: String
# Default value: ping.png
Ping Icon File = ping.png

## On-screen size of the ping icon in pixels. Fixed at all distances.
# Setting type: Single
# Default value: 32
# Acceptable value range: From 8 to 160
Ping Size = 32

## Tint applied to the ping icon.
# Setting type: Color
# Default value: FFD140FF
Ping Color = FFD140FF

## Opacity of a ping before it starts expiring.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.05 to 1
Ping Opacity = 1

## Seconds a ping stays on screen, including its fade out.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 1 to 30
Ping Duration = 4

## Seconds of eased fade at the end of a ping's life. Appearance is always instant. 0 makes it vanish abruptly.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 5
Ping Fade Out Time = 0.6

## Oldest pings are dropped once this many are active.
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 1 to 30
Max Pings On Screen = 6

## Play a sound when a ping is placed, yours or a teammate's.
# Setting type: Boolean
# Default value: true
Ping Sound = true

## Audio file inside the plugin's 'sounds' folder (.ogg, .wav or .mp3). Leave empty, or point at a file that does not exist, to use the game's built-in UI sound instead. Changes apply on the next ping.
# Setting type: String
# Default value: ping.ogg
Ping Sound File = ping.ogg

## Volume of the custom ping sound. The game's master volume still applies on top.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 1
Ping Sound Volume = 0.8

## Draw teammates' Fika pings with this mod's marker and fade instead of Fika's, so incoming and outgoing pings look the same. Turn off to leave Fika's ping visuals alone.
# Setting type: Boolean
# Default value: true
Restyle Incoming Pings = true

## Show the 'X pinged a location' message when a teammate pings. Only applies while 'Restyle Incoming Pings' is on.
# Setting type: Boolean
# Default value: true
Ping Notification = true

[6. Downed]

## Recolour a teammate's dot while they are downed, ramping from 'Downed Color' to 'Bleeding Out Color' as their revive timer runs down. Needs Fika's revive system enabled.
# Setting type: Boolean
# Default value: true
Color Downed Teammates = true

## Colour the moment a teammate goes down. Default is coral (#FF7F50).
# Setting type: Color
# Default value: FF7F50FF
Downed Color = FF7F50FF

## Colour as their bleedout timer reaches zero. Default is a dull red (#7C4848).
# Setting type: Color
# Default value: 7C4848FF
Bleeding Out Color = 7C4848FF

