## Settings file was created by plugin Coop Dot HUD v1.0.0
## Plugin GUID: com.spt.coopdothud

[1. General]

## Master switch for the teammate dots.
# Setting type: Boolean
# Default value: true
Enabled = true

[2. Icon]

## PNG file inside the plugin's 'icons' folder. Drop your own file in there and change this name. A white icon tints best.
# Setting type: String
# Default value: dot.png
Icon File = dot.png

## On-screen size of the dot in pixels. This never changes with distance.
# Setting type: Single
# Default value: 18
# Acceptable value range: From 4 to 128
Dot Size = 18

## On: 'Dot Size' is measured at 1080p and scales with screen height, so the dot looks the same on any monitor. Off: 'Dot Size' is raw pixels.
# Setting type: Boolean
# Default value: true
Scale With Resolution = true

## Tint applied to the icon.
# Setting type: Color
# Default value: 59D9FFFF
Dot Color = 59D9FFFF

## Base opacity of the dot.
# Setting type: Single
# Default value: 0.9
# Acceptable value range: From 0.05 to 1
Opacity = 0.9

[3. Visibility]

## Teammates further away than this are not drawn.
# Setting type: Single
# Default value: 300
# Acceptable value range: From 10 to 1000
Max Distance = 300

## Fade the dot out as the teammate gets further away. The size stays fixed either way.
# Setting type: Boolean
# Default value: false
Fade With Distance = true

## Opacity floor used when fading.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 1
Minimum Opacity = 0.25

## Hide dots while aiming down a magnified optic.
# Setting type: Boolean
# Default value: true
Hide In Optic = true

## Opacity multiplier while aiming down sights.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Opacity While Aiming = 0.5

## Hide the dot when the teammate is behind geometry. Costs a raycast per teammate a few times a second.
# Setting type: Boolean
# Default value: false
Hide Behind Walls = true

## Hide all dots once your own player is dead.
# Setting type: Boolean
# Default value: true
Hide When You Are Dead = true

[4. Tracking]

## Metres to raise (+) or lower (-) the dot from the chest bone. 0 sits on centre of mass.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -1 to 1.5
Vertical Offset = 0

## Project through the optic camera when scoped so the dot stays on the teammate at magnification.
# Setting type: Boolean
# Default value: true
Track Through Optic Zoom = true

## Render order of the dot overlay. Raise it if something draws over the dots, lower it if the dots draw over a menu.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 0 to 900
Canvas Sort Order = 100

