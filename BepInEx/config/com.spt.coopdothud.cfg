## Settings file was created by plugin Coop Dot HUD v1.0.0
## Plugin GUID: com.spt.coopdothud

[1. General]

## Master switch for the teammate dots.
# Setting type: Boolean
# Default value: true
Enabled = true

[2. Icon]

## PNG file inside the plugin's 'icons' folder. Drop your own file in there and change this name. A white icon tints best.
# Setting type: String
# Default value: dot.png
Icon File = dot.png

## On-screen size of the dot in pixels at full scale, before any distance shrinking.
# Setting type: Single
# Default value: 18
# Acceptable value range: From 4 to 128
Dot Size = 18

## On: 'Dot Size' is measured at 1080p and scales with screen height, so the dot looks the same on any monitor. Off: 'Dot Size' is raw pixels.
# Setting type: Boolean
# Default value: true
Scale With Resolution = true

## Tint applied to the icon.
# Setting type: Color
# Default value: 59D9FFFF
Dot Color = BFD9FFFF

## Base opacity of the dot.
# Setting type: Single
# Default value: 0.9
# Acceptable value range: From 0.05 to 1
Opacity = 0.9

## Keep the dot at full size up close, then let it shrink with range so it stops covering the teammate it marks. Off gives a permanently fixed size.
# Setting type: Boolean
# Default value: true
Shrink With Distance = true

## Inside this range the dot stays at full 'Dot Size'. Shrinking only begins past it.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 1 to 50
Shrink Start Distance = 5

## How hard the dot shrinks past the start distance. 1 matches real perspective, so the dot shrinks at the same rate the teammate does. Lower values shrink more gently; 0 disables shrinking.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Shrink Strength = 1

## Floor for shrinking, as a fraction of 'Dot Size'. Stops far-off teammates from becoming invisible.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0.05 to 1
Minimum Scale = 0.3

[3. Visibility]

## Teammates further away than this are not drawn.
# Setting type: Single
# Default value: 300
# Acceptable value range: From 10 to 1000
Max Distance = 300

## Fade the dot out as the teammate gets further away. This is opacity only; size shrinking is controlled separately.
# Setting type: Boolean
# Default value: false
Fade With Distance = true

## Opacity floor used when fading.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 1
Minimum Opacity = 0.25

## Hide dots while aiming down a magnified optic.
# Setting type: Boolean
# Default value: true
Hide In Optic = true

## Opacity multiplier while aiming down sights.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Opacity While Aiming = 0.5

## Dim or hide the dot when the teammate is behind geometry, per 'Occluded Opacity'. Costs a raycast per teammate a few times a second.
# Setting type: Boolean
# Default value: false
Use Occlusion = false

## Opacity multiplier applied while the teammate is behind cover. 1 is no change, 0 hides the dot completely.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 1
Occluded Opacity = 0.3

## Seconds the dot takes to ease between its normal and occluded opacity. 0 snaps instantly.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 1
Occlusion Fade Time = 0.15

## Hide all dots once your own player is dead.
# Setting type: Boolean
# Default value: true
Hide When You Are Dead = true

Hide Behind Walls = true

[4. Tracking]

## Metres to raise (+) or lower (-) the dot from the chest bone. 0 sits on centre of mass.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -1 to 1.5
Vertical Offset = 0

## Project through the optic camera when scoped so the dot stays on the teammate at magnification.
# Setting type: Boolean
# Default value: true
Track Through Optic Zoom = true

## Render order of the dot overlay. Raise it if something draws over the dots, lower it if the dots draw over a menu.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 0 to 900
Canvas Sort Order = 100

[5. Ping]

## Drop a marker where you are looking by quickly double tapping the ping key.
# Setting type: Boolean
# Default value: true
Enable Ping = true

