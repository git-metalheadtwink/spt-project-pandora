[Bleeding - AI]

## Total HP an arterial wound bleeds out of an AI target, as a multiple of post-armor damage.
# Setting type: Single
# Default value: 1.15
# Acceptable value range: From 0.1 to 5
BleedBudget = 1.15

## Seconds an untreated arterial wound bleeds on an AI target. Short, so the same blood loss arrives far faster than it does on a human. Too short and the wound clots before it can finish the job.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 3 to 180
BleedDuration = 12

## 0 = flat bleed rate for the whole duration. 1 = most of the blood loss lands in the first few seconds.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 1
FrontLoad = 0.2

## Share of each arterial tick that drains straight to the chest instead of into the wounded limb. The stomach is a 70 HP sink that can never kill, so at 0.25 most of the blood loss was disappearing into it and wounds clotted with the chest still standing. Half is the measured value that lands the kill.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
SystemicFraction = 0.5

## Extra bleed rate per additional arterial wound on the same target. At 0.25 a three-wound target bleeds 50% faster and a five-wound target twice as fast.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 1
Escalation = 0.25

## Hard cap on the escalation multiplier.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 8
MaxEscalation = 3

## Maximum simultaneous arterial wounds counted per body part. Opening more evicts the oldest along with its unspent blood loss, so a low cap silently punishes concentrating fire on one limb. Escalation is bounded by its own ceiling, so this can sit high safely.
# Setting type: Int32
# Default value: 8
# Acceptable value range: From 1 to 12
StackCap = 8

## How much of an arterial wound a bandage closes when a bot heals itself. Lower this if bots trivially undo arterial hits.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
TreatmentClotProgress = 1

## Scales every zone chance for AI targets. At 1.4 the 60% femoral becomes 84%, so three thigh rounds reliably sever.
# Setting type: Single
# Default value: 1.4
# Acceptable value range: From 0 to 3
ChanceMultiplier = 1.4

## Scavs inherit the AI profile; this scales their blood loss.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
ScavMultiplier = 1

## PMC bots inherit the AI profile; this scales their blood loss.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
PmcBotMultiplier = 1

